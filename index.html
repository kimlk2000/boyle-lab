<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보일의 법칙 실험</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f7f6; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!--
    아래 src의 주소를 Apps Script 웹앱 주소로 바꾸세요.
    (Apps Script 편집기 → 배포 → 배포 관리 → 웹 앱 URL, ".../exec"로 끝나는 주소)
  -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbxd6DEkIjiOHQ4L5tAEsDrNwN0uIztTNkA-GXSNdJf5YfWI7DH_0H-FmP2M5E9YPpNO5w/exec"
    title="보일의 법칙 실험"
    allow="clipboard-write">
  </iframe>
</body>
</html>
